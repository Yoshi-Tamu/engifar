<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ENGIFAR - ロケット製作中</title>
<link rel="stylesheet" href="rocket-loading.css">
</head>
<body>

<div class="rocket-page" id="rocketPage">

  <!-- 共有グラデーション・フィルタ定義 -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="rlBodyGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="oklch(0.97 0.005 260)"/>
        <stop offset="1" stop-color="oklch(0.82 0.015 260)"/>
      </linearGradient>
      <radialGradient id="rlWindowGrad" cx="0.35" cy="0.3" r="0.8">
        <stop offset="0" stop-color="oklch(0.9 0.08 202)"/>
        <stop offset="1" stop-color="oklch(0.55 0.14 205)"/>
      </radialGradient>
      <linearGradient id="rlPolishGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="oklch(0.99 0.008 210)"/>
        <stop offset="0.55" stop-color="oklch(0.95 0.02 205)"/>
        <stop offset="1" stop-color="oklch(0.88 0.03 200)"/>
      </linearGradient>
      <radialGradient id="rlFlashGrad" cx="0.5" cy="0.5" r="0.5">
        <stop offset="0" stop-color="oklch(0.99 0.01 90 / 0.95)"/>
        <stop offset="0.55" stop-color="oklch(0.95 0.05 95 / 0.4)"/>
        <stop offset="1" stop-color="oklch(0.95 0.05 95 / 0)"/>
      </radialGradient>
      <filter id="rlSmokeBlur" x="-60%" y="-60%" width="220%" height="220%">
        <feGaussianBlur stdDeviation="4"/>
      </filter>
      <path id="rlSparkleStar" d="M0,-11 L3.2,-3.2 L11,0 L3.2,3.2 L0,11 L-3.2,3.2 L-11,0 L-3.2,-3.2 Z"/>
    </defs>
  </svg>

  <!-- 背景の星空 -->
  <svg class="rocket-bg-stars" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <circle class="rocket-star" cx="120" cy="90" r="2" style="animation-delay:0s"/>
    <circle class="rocket-star" cx="260" cy="180" r="1.6" style="animation-delay:0.4s"/>
    <circle class="rocket-star" cx="1180" cy="120" r="2.2" style="animation-delay:0.8s"/>
    <circle class="rocket-star" cx="1320" cy="240" r="1.6" style="animation-delay:1.2s"/>
    <circle class="rocket-star rocket-star-accent" cx="90" cy="340" r="2" style="animation-delay:0.6s"/>
    <circle class="rocket-star rocket-star-accent" cx="1360" cy="420" r="2" style="animation-delay:1.6s"/>
    <circle class="rocket-star" cx="200" cy="500" r="1.8" style="animation-delay:0.2s"/>
    <circle class="rocket-star" cx="1250" cy="560" r="1.8" style="animation-delay:1.0s"/>
    <circle class="rocket-star" cx="60" cy="620" r="1.6" style="animation-delay:1.4s"/>
    <circle class="rocket-star" cx="1390" cy="150" r="1.4" style="animation-delay:1.8s"/>
    <circle class="rocket-star" cx="420" cy="760" r="1.4" style="animation-delay:2.0s"/>
    <circle class="rocket-star" cx="980" cy="70" r="1.8" style="animation-delay:0.9s"/>
    <circle class="rocket-star" cx="720" cy="820" r="1.6" style="animation-delay:1.3s"/>
    <circle class="rocket-star" cx="540" cy="40" r="1.4" style="animation-delay:0.7s"/>
  </svg>

  <main class="rocket-stage" id="rocketStage" data-state="repairing">

    <svg class="rocket-illustration" viewBox="0 0 600 480" role="img" aria-label="アバターたちがロケットを製作し、最後に完成させて喜んでいる様子">

      <!-- ロケット本体 -->
      <g transform="translate(172,8) scale(1.22) rotate(-2)">
        <rect x="66" y="238" width="88" height="60" rx="14" fill="oklch(0.38 0.03 262)"/>
        <path d="M66 248 L18 294 L50 298 L66 268 Z" fill="oklch(0.7 0.12 202)"/>
        <path d="M154 248 L202 294 L170 298 L154 268 Z" fill="oklch(0.7 0.12 202)"/>
        <rect x="58" y="68" width="104" height="190" rx="42" fill="url(#rlBodyGrad)"/>
        <rect x="58" y="148" width="104" height="10" fill="oklch(0.72 0.19 42)"/>
        <rect x="58" y="166" width="104" height="6" fill="oklch(0.76 0.12 202)"/>
        <circle cx="110" cy="116" r="30" fill="oklch(0.3 0.02 262)"/>
        <circle cx="110" cy="116" r="24" fill="url(#rlWindowGrad)"/>
        <ellipse cx="101" cy="106" rx="8" ry="5" fill="oklch(0.98 0.01 200 / 0.6)"/>
        <path d="M58 68 Q58 4 110 2 Q162 4 162 68 Z" fill="url(#rlBodyGrad)"/>

        <!-- 常時表示のパネル継ぎ目・リベット -->
        <circle cx="62" cy="90" r="2.4" fill="oklch(0.55 0.03 262)"/>
        <circle cx="158" cy="90" r="2.4" fill="oklch(0.55 0.03 262)"/>
        <circle cx="62" cy="228" r="2.4" fill="oklch(0.55 0.03 262)"/>
        <circle cx="158" cy="228" r="2.4" fill="oklch(0.55 0.03 262)"/>
        <line x1="58" y1="196" x2="66" y2="196" stroke="oklch(0.5 0.03 262)" stroke-width="2"/>
        <line x1="154" y1="196" x2="162" y2="196" stroke="oklch(0.5 0.03 262)" stroke-width="2"/>

        <!-- 電源ポート -->
        <circle cx="156" cy="142" r="9" fill="oklch(0.24 0.03 262)"/>
        <circle cx="156" cy="142" r="5" fill="oklch(0.76 0.12 202)"/>

        <!-- 製作中だけ見える: 開いたハッチ・配線・外れたボルト -->
        <g class="rocket-repair-details">
          <rect x="66" y="188" width="34" height="30" rx="6" fill="oklch(0.24 0.03 262)"/>
          <path d="M70 192 Q78 200 72 208" fill="none" stroke="oklch(0.72 0.19 42)" stroke-width="2.2" stroke-linecap="round"/>
          <path d="M76 192 Q84 202 78 212" fill="none" stroke="oklch(0.76 0.12 202)" stroke-width="2.2" stroke-linecap="round"/>
          <path class="rocket-hatch-glow" d="M72 194 L82 200 L74 204 L86 210" fill="none" stroke="oklch(0.85 0.15 93)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          <circle class="rocket-hatch-glow bot-spark" cx="90" cy="200" r="3" fill="oklch(0.85 0.15 93)"/>
          <circle class="rocket-hatch-glow bot-spark" cx="80" cy="212" r="2.2" fill="oklch(0.85 0.15 93)" style="animation-delay:0.3s"/>
          <circle class="rocket-hatch-glow bot-spark" cx="94" cy="192" r="1.8" fill="oklch(0.85 0.15 93)" style="animation-delay:0.6s"/>
          <circle cx="60" cy="224" r="3" fill="oklch(0.6 0.02 260)" stroke="oklch(0.4 0.02 260)" stroke-width="1"/>
          <circle cx="74" cy="230" r="2.4" fill="oklch(0.6 0.02 260)" stroke="oklch(0.4 0.02 260)" stroke-width="1"/>
        </g>

        <!-- 完成後だけ見える: 閉じたハッチのつやと輝き -->
        <g class="rocket-polish-details">
          <rect x="58" y="68" width="104" height="190" rx="42" fill="url(#rlPolishGrad)"/>
          <path d="M58 68 Q58 4 110 2 Q162 4 162 68 Z" fill="url(#rlPolishGrad)"/>
          <!-- オレンジ・青の帯も、つや塗装の上に描き直して完成後も消えないようにする -->
          <rect x="58" y="148" width="104" height="10" fill="oklch(0.72 0.19 42)"/>
          <rect x="58" y="166" width="104" height="6" fill="oklch(0.76 0.12 202)"/>
          <!-- つや塗装の上に窓を描き直し、完成後も窓が隠れないようにする -->
          <circle cx="110" cy="116" r="30" fill="oklch(0.3 0.02 262)"/>
          <circle cx="110" cy="116" r="24" fill="url(#rlWindowGrad)"/>
          <ellipse cx="101" cy="106" rx="8" ry="5" fill="oklch(0.98 0.01 200 / 0.6)"/>
          <rect x="66" y="188" width="34" height="30" rx="8" fill="none" stroke="oklch(0.95 0.04 202)" stroke-width="2"/>
          <path class="rocket-shine-sweep" d="M40 40 L70 10 L92 22 L52 62 Z" fill="oklch(0.98 0.01 200 / 0.6)"/>
          <!-- パネル継ぎ目・リベットも、つや塗装の上に描き直して完成後も消えないようにする -->
          <circle cx="62" cy="90" r="2.4" fill="oklch(0.55 0.03 262)"/>
          <circle cx="158" cy="90" r="2.4" fill="oklch(0.55 0.03 262)"/>
          <circle cx="62" cy="228" r="2.4" fill="oklch(0.55 0.03 262)"/>
          <circle cx="158" cy="228" r="2.4" fill="oklch(0.55 0.03 262)"/>
          <line x1="58" y1="196" x2="66" y2="196" stroke="oklch(0.5 0.03 262)" stroke-width="2"/>
          <line x1="154" y1="196" x2="162" y2="196" stroke="oklch(0.5 0.03 262)" stroke-width="2"/>
        </g>
      </g>

      <!-- ホース -->
      <path class="repair-hose" d="M380 150 Q368 162 362 181" fill="none" stroke="oklch(0.72 0.17 55)" stroke-width="4" stroke-linecap="round"/>

      <!-- エンジン付近の蒸気(常時の整備熱) -->
      <g transform="translate(330,335)">
        <path class="repair-steam-wisp" d="M-10 0 Q-16 -14 -6 -24 Q-2 -30 -8 -40" fill="none" stroke="oklch(0.9 0.01 258 / 0.4)" stroke-width="5" stroke-linecap="round"/>
        <path class="repair-steam-wisp" d="M10 6 Q16 -8 6 -18 Q2 -24 8 -34" fill="none" stroke="oklch(0.9 0.01 258 / 0.3)" stroke-width="4" stroke-linecap="round" style="animation-delay:1.1s"/>
      </g>

      <!-- アバターA: スパナで製作(左) -->
      <g transform="translate(186,245) scale(0.92)">
        <g class="repair-bot repair-bot-a repair-bob" style="--jump:16px; --jump-delay:0s">
          <ellipse cx="50" cy="118" rx="24" ry="7" fill="oklch(0.62 0.20 24)" opacity="0.28"/>
          <line x1="50" y1="10" x2="50" y2="24" stroke="oklch(0.62 0.20 24)" stroke-width="4" stroke-linecap="round"/>
          <circle cx="50" cy="8" r="6" fill="oklch(0.85 0.1 202)"/>
          <rect x="20" y="22" width="60" height="76" rx="30" fill="oklch(0.62 0.20 24)" stroke="oklch(0.2 0.02 260 / 0.25)" stroke-width="2"/>
          <rect x="32" y="42" width="36" height="26" rx="12" fill="oklch(0.97 0.006 260)"/>
          <circle cx="43" cy="55" r="4" fill="oklch(0.22 0.03 262)"/>
          <circle cx="57" cy="55" r="4" fill="oklch(0.22 0.03 262)"/>
          <g class="bot-tool-wrench">
            <rect x="66" y="42" width="12" height="32" rx="6" fill="oklch(0.62 0.20 24)" stroke="oklch(0.2 0.02 260 / 0.25)" stroke-width="1.5"/>
            <g transform="translate(76,34)">
              <rect x="-5" y="-16" width="10" height="24" rx="3.5" fill="oklch(0.92 0.01 258)"/>
              <circle cx="0" cy="-18" r="7.5" fill="none" stroke="oklch(0.92 0.01 258)" stroke-width="3.6"/>
            </g>
          </g>
        </g>
      </g>

      <!-- アバターB: パーツ取り付け(右) -->
      <g transform="translate(443,106) scale(-0.88,0.88)">
        <g class="repair-bot repair-bot-b repair-bob" style="--jump:20px; --jump-delay:0.12s">
          <ellipse cx="50" cy="118" rx="24" ry="7" fill="oklch(0.62 0.17 253)" opacity="0.28"/>
          <line x1="50" y1="10" x2="50" y2="24" stroke="oklch(0.62 0.17 253)" stroke-width="4" stroke-linecap="round"/>
          <circle cx="50" cy="8" r="6" fill="oklch(0.85 0.1 202)"/>
          <rect x="20" y="22" width="60" height="76" rx="30" fill="oklch(0.62 0.17 253)" stroke="oklch(0.2 0.02 260 / 0.25)" stroke-width="2"/>
          <rect x="32" y="42" width="36" height="26" rx="12" fill="oklch(0.97 0.006 260)"/>
          <circle cx="43" cy="55" r="4" fill="oklch(0.22 0.03 262)"/>
          <circle cx="57" cy="55" r="4" fill="oklch(0.22 0.03 262)"/>
          <g>
            <rect x="66" y="50" width="11" height="26" rx="5.5" fill="oklch(0.62 0.17 253)" stroke="oklch(0.2 0.02 260 / 0.25)" stroke-width="1.5"/>
            <rect class="bot-tool-panel" x="72" y="42" width="22" height="17" rx="4" fill="oklch(0.76 0.12 202)" stroke="oklch(0.9 0.05 202)" stroke-width="1.4"/>
          </g>
        </g>
      </g>

      <!-- アバターC: 配線確認(手前中央) -->
      <g transform="translate(242,353) scale(0.85)">
        <g class="repair-bot repair-bot-c repair-bob" style="--jump:13px; --jump-delay:0.25s">
          <ellipse cx="50" cy="118" rx="24" ry="7" fill="oklch(0.62 0.16 148)" opacity="0.28"/>
          <line x1="50" y1="10" x2="50" y2="24" stroke="oklch(0.62 0.16 148)" stroke-width="4" stroke-linecap="round"/>
          <circle cx="50" cy="8" r="6" fill="oklch(0.85 0.1 202)"/>
          <rect x="20" y="22" width="60" height="76" rx="30" fill="oklch(0.62 0.16 148)" stroke="oklch(0.2 0.02 260 / 0.25)" stroke-width="2"/>
          <rect x="32" y="42" width="36" height="26" rx="12" fill="oklch(0.97 0.006 260)"/>
          <circle cx="43" cy="55" r="4" fill="oklch(0.22 0.03 262)"/>
          <circle cx="57" cy="55" r="4" fill="oklch(0.22 0.03 262)"/>
          <g class="bot-tool-wire">
            <rect x="66" y="44" width="11" height="28" rx="5.5" fill="oklch(0.62 0.16 148)" stroke="oklch(0.2 0.02 260 / 0.25)" stroke-width="1.5"/>
            <path d="M75 44 Q80 22 68 8" fill="none" stroke="oklch(0.85 0.15 93)" stroke-width="3" stroke-linecap="round"/>
          </g>
        </g>
      </g>

      <!-- 足元の工具箱 -->
      <g transform="translate(330,432)">
        <ellipse cx="30" cy="40" rx="42" ry="8" fill="oklch(0.1 0.02 264)" opacity="0.25"/>
        <rect x="0" y="10" width="60" height="28" rx="6" fill="oklch(0.62 0.20 24)" stroke="oklch(0.2 0.02 260 / 0.3)" stroke-width="2"/>
        <rect x="20" y="2" width="20" height="12" rx="4" fill="oklch(0.5 0.16 24)"/>
        <rect x="6" y="18" width="48" height="4" fill="oklch(0.92 0.01 258 / 0.5)"/>
        <line x1="10" y1="-4" x2="4" y2="10" stroke="oklch(0.55 0.02 260)" stroke-width="3" stroke-linecap="round"/>
        <circle cx="2" cy="12" r="4" fill="oklch(0.85 0.1 202)"/>
      </g>

      <!-- 忙しさを表す煙(speedingUp/smoke の間だけ、アバターとロケットをほとんど覆うほど濃く見える)
           アバターより後に描画し、煙が手前に重なって姿を隠すようにする -->
      <g class="smoke-layer" filter="url(#rlSmokeBlur)">
        <!-- 土台のもや: アバターの軌道がどこにあっても最低限これだけは覆われるようにする下地 -->
        <rect class="smoke-haze" x="95" y="55" width="420" height="400" rx="130" fill="oklch(0.94 0.006 258 / 0.8)"/>
        <circle class="smoke-puff" cx="150" cy="190" r="50" fill="oklch(0.93 0.008 258 / 0.92)" style="--dx:-16px; animation-delay:0s"/>
        <circle class="smoke-puff" cx="210" cy="130" r="46" fill="oklch(0.91 0.008 258 / 0.88)" style="--dx:12px; animation-delay:0.3s"/>
        <circle class="smoke-puff" cx="270" cy="155" r="54" fill="oklch(0.94 0.008 258 / 0.92)" style="--dx:-10px; animation-delay:0.6s"/>
        <circle class="smoke-puff" cx="330" cy="115" r="48" fill="oklch(0.92 0.008 258 / 0.88)" style="--dx:14px; animation-delay:0.9s"/>
        <circle class="smoke-puff" cx="390" cy="145" r="52" fill="oklch(0.93 0.008 258 / 0.9)" style="--dx:-18px; animation-delay:1.2s"/>
        <circle class="smoke-puff" cx="445" cy="180" r="46" fill="oklch(0.91 0.008 258 / 0.86)" style="--dx:10px; animation-delay:1.5s"/>
        <circle class="smoke-puff" cx="470" cy="240" r="50" fill="oklch(0.93 0.008 258 / 0.9)" style="--dx:-12px; animation-delay:0.15s"/>
        <circle class="smoke-puff" cx="435" cy="300" r="54" fill="oklch(0.92 0.008 258 / 0.9)" style="--dx:16px; animation-delay:0.45s"/>
        <circle class="smoke-puff" cx="375" cy="335" r="48" fill="oklch(0.94 0.008 258 / 0.86)" style="--dx:-14px; animation-delay:0.75s"/>
        <circle class="smoke-puff" cx="305" cy="365" r="56" fill="oklch(0.93 0.008 258 / 0.92)" style="--dx:10px; animation-delay:1.05s"/>
        <circle class="smoke-puff" cx="235" cy="345" r="50" fill="oklch(0.91 0.008 258 / 0.88)" style="--dx:-16px; animation-delay:1.35s"/>
        <circle class="smoke-puff" cx="175" cy="305" r="48" fill="oklch(0.93 0.008 258 / 0.88)" style="--dx:18px; animation-delay:1.65s"/>
        <circle class="smoke-puff" cx="150" cy="245" r="50" fill="oklch(0.94 0.008 258 / 0.9)" style="--dx:-8px; animation-delay:1.95s"/>
        <circle class="smoke-puff" cx="275" cy="255" r="60" fill="oklch(0.94 0.008 258 / 0.95)" style="--dx:12px; animation-delay:0.5s"/>
        <circle class="smoke-puff" cx="345" cy="225" r="58" fill="oklch(0.93 0.008 258 / 0.92)" style="--dx:-10px; animation-delay:1.1s"/>
        <circle class="smoke-puff" cx="225" cy="205" r="46" fill="oklch(0.92 0.008 258 / 0.86)" style="--dx:14px; animation-delay:1.8s"/>
        <circle class="smoke-puff" cx="405" cy="385" r="44" fill="oklch(0.91 0.008 258 / 0.82)" style="--dx:-12px; animation-delay:2.1s"/>
        <circle class="smoke-puff" cx="245" cy="410" r="42" fill="oklch(0.93 0.008 258 / 0.8)" style="--dx:10px; animation-delay:2.3s"/>
      </g>

      <!-- 完成の輝き(completed の間だけ見える。煙より後に描画して一番手前に出す) -->
      <g class="sparkle-layer">
        <circle class="sparkle-flash" cx="306" cy="188" r="170" fill="url(#rlFlashGrad)"/>

        <g class="sparkle-star" style="animation-delay:0s" transform="translate(224,118)"><use href="#rlSparkleStar" fill="oklch(0.92 0.15 95)"/></g>
        <g class="sparkle-star" style="animation-delay:0.35s" transform="translate(396,104) scale(0.8)"><use href="#rlSparkleStar" fill="oklch(0.88 0.1 202)"/></g>
        <g class="sparkle-star" style="animation-delay:0.7s" transform="translate(430,254) scale(0.65)"><use href="#rlSparkleStar" fill="oklch(0.95 0.03 90)"/></g>
        <g class="sparkle-star" style="animation-delay:1.05s" transform="translate(198,322) scale(0.75)"><use href="#rlSparkleStar" fill="oklch(0.88 0.1 202)"/></g>
        <g class="sparkle-star" style="animation-delay:0.5s" transform="translate(372,340) scale(0.6)"><use href="#rlSparkleStar" fill="oklch(0.92 0.15 95)"/></g>
        <g class="sparkle-star" style="animation-delay:1.3s" transform="translate(300,64) scale(0.55)"><use href="#rlSparkleStar" fill="oklch(0.95 0.03 90)"/></g>

        <circle class="sparkle-particle" cx="240" cy="200" r="2.6" fill="oklch(0.95 0.02 90)" style="animation-delay:0.2s"/>
        <circle class="sparkle-particle" cx="392" cy="180" r="2.2" fill="oklch(0.9 0.06 202)" style="animation-delay:0.9s"/>
        <circle class="sparkle-particle" cx="410" cy="300" r="2.4" fill="oklch(0.95 0.02 90)" style="animation-delay:1.4s"/>
        <circle class="sparkle-particle" cx="216" cy="280" r="2" fill="oklch(0.9 0.06 202)" style="animation-delay:0.6s"/>
        <circle class="sparkle-particle" cx="330" cy="356" r="2.3" fill="oklch(0.95 0.02 90)" style="animation-delay:1.7s"/>
      </g>
    </svg>

    <!-- ロード中テキスト(JSが文字を1文字ずつ span に分割して波アニメーションを付ける) -->
    <p class="rocket-loading-text" id="rocketLoadingText" aria-live="polite"></p>

  </main>

  <!-- 開発/確認用: アニメーションを最初から再生(本番では非表示/削除可) -->
  <div class="dev-controls" id="devControls">
    <button type="button" id="devRestartBtn">🔁 最初から再生</button>
  </div>

</div>

<script src="rocket-loading.js"></script>
<script>
(function () {
  "use strict";
  var NEXT_PAGE = "./rocket.html";
  var POST_COMPLETE_PAUSE_MS = 600;
  document.addEventListener("engifar:rocket-loading-completed", function () {
    window.setTimeout(function () {
      window.location.href = NEXT_PAGE + window.location.hash;
    }, POST_COMPLETE_PAUSE_MS);
  });
})();
</script>
</body>
</html>
