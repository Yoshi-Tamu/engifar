<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ENGIFAR - 集計結果</title>
<link rel="stylesheet" href="result-final.css">
</head>
<body>

<div class="rf-app" id="rfApp">

  <!-- ============================================================
       画面A: ランキング発表(3位 → 2位 → 1位、左から右へカットイン)
       ============================================================ -->
  <section class="rf-screen rf-screen-ranking is-active" id="screenRanking">
    <div class="rf-ranking-bg" aria-hidden="true">
      <div class="rf-stars"></div>
      <div class="rf-ranking-burst"></div>
      <div class="rf-ranking-flash" id="rankingFlash"></div>
    </div>
    <p class="rf-ranking-caption">チーム内ランキング発表</p>
    <div class="rf-ranking-row" id="rankingRow" role="status" aria-live="polite" aria-atomic="true">
      <div class="rf-ranking-name" id="rankingName"></div>
      <div class="rf-ranking-avatar" id="rankingAvatar"></div>
      <div class="rf-ranking-place" id="rankingPlace"></div>
    </div>
  </section>

  <!-- ============================================================
       画面B: 表彰式(1位に王冠、紙吹雪・スポットライト演出)
       ============================================================ -->
  <section class="rf-screen rf-screen-podium" id="screenPodium" aria-hidden="true">
    <div class="rf-podium-bg" aria-hidden="true">
      <div class="rf-stars"></div>
      <div class="rf-spotlight rf-spotlight-1"></div>
      <div class="rf-spotlight rf-spotlight-2"></div>
      <div class="rf-confetti" id="confettiLayer"></div>
    </div>
    <h2 class="rf-podium-title">表彰式</h2>
    <div class="rf-podium-stage" id="podiumStage"></div>
    <button type="button" class="rf-next-btn" id="podiumNextBtn">
      <span>次へ</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
  </section>

  <!-- ============================================================
       画面C: 最終リザルト(左: メンバー一覧 / 右: チームパラメータ)
       ============================================================ -->
  <section class="rf-screen rf-screen-final" id="screenFinal" aria-hidden="true">
    <div class="rf-final-layout">

      <div class="rf-final-left">
        <div class="rf-final-left-head">
          <h2 class="rf-final-heading">チームリザルト</h2>
          <div class="rf-sort-toggle" role="group" aria-label="並び替え">
            <button type="button" class="rf-sort-btn" id="sortByNameBtn" data-sort="name" aria-pressed="false">名前順</button>
            <button type="button" class="rf-sort-btn" id="sortByScoreBtn" data-sort="score" aria-pressed="false">スコア順</button>
          </div>
        </div>
        <p class="rf-roster-hint">アバターをタップしてプロフィールを見る</p>
        <div class="rf-roster" id="rosterGrid"></div>
      </div>

      <div class="rf-final-right">
        <h2 class="rf-final-heading">チームパラメータ</h2>
        <div class="rf-team-radar" id="teamRadarWrap"></div>
        <div class="rf-radar-legend" id="radarLegend"></div>
        <div class="rf-matching">
          <span class="rf-matching-label">チームマッチング度</span>
          <span class="rf-matching-value"><span id="matchingPercentValue">0</span>%</span>
        </div>
      </div>

    </div>

    <!-- 自分の集計(単体スコア・レーダーチャート等)へ進むボタン。
         result-final.js の画面Cには本来遷移導線が無いため、この画面の
         フローを EngiFar-localDemo の既存 result.html に接続するために
         追加した。ボタンの見た目は画面Bの rf-next-btn をそのまま再利用する。 -->
    <button type="button" class="rf-next-btn" id="finalProceedBtn">
      <span>集計を見る</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
  </section>

  <!-- ============================================================
       プロフィールモーダル(room.html のプロフィール表示を踏襲)
       ============================================================ -->
  <div class="rf-profile-overlay" id="profileOverlay" hidden></div>
  <div class="rf-profile-modal" id="profileModal" hidden role="dialog" aria-modal="true" aria-labelledby="profileModalName">
    <button type="button" class="rf-profile-close" id="profileCloseBtn" aria-label="閉じる">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>
    </button>
    <div class="rf-profile-content" id="profileModalContent"></div>
  </div>

</div>

<script src="result-final-data.js"></script>
<script src="result-final.js"></script>
<script>
  // 画面C(最終リザルト)の「集計を見る」ボタンから、EngiFar-localDemo の
  // 既存の単体集計画面(result.html)へ遷移する。result-final.html は
  // script.js を読み込まない独立ページのため、goTo() ではなく直接
  // window.location を書き換える。state は sessionStorage 経由で
  // result.html の loadState() が既に拾えるが、フォールバックとして
  // 遷移時点の URL ハッシュ(#mission=...)もそのまま引き継ぐ。
  (function () {
    "use strict";
    var proceedBtn = document.getElementById("finalProceedBtn");
    if (!proceedBtn) return;
    proceedBtn.addEventListener("click", function () {
      window.location.href = "./result.html" + window.location.hash;
    });
  })();
</script>
</body>
</html>
