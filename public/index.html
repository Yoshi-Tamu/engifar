<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <title>EngiFar | 遠距離を目指せ!!</title>
  <link rel="stylesheet" href="./style.css?v=20260826-flow">
  <script type="module" src="./script.js?v=20260826-flow"></script>
</head>
<body>
  <div class="app-shell reference-home" id="app" data-page="home">
    <div class="space-background" aria-hidden="true"></div>
    <button class="guide-open-button guide-open-button--home" type="button" aria-haspopup="dialog"><span>?</span> 遊び方</button>
    <main class="reference-home-main">
      <header class="reference-hero"><p class="reference-logo">ENGIFAR</p><h1>プログラミングテストのスコアで<wbr>遠距離を目指せ！</h1></header>
      <section class="reference-scene" aria-label="仲間のクルーとロケット">
        <span class="scene-orbit scene-orbit--outer" aria-hidden="true"></span><span class="scene-orbit scene-orbit--inner" aria-hidden="true"></span>
        <span class="crew-avatar scene-bot scene-bot--one" style="--crew-color:#54d37c" aria-label="緑のクルー"><i></i></span>
        <span class="crew-avatar scene-bot scene-bot--two" style="--crew-color:#5ca9ff" aria-label="青のクルー"><i></i></span>
        <svg class="home-rocket" viewBox="0 0 220 400" role="img" aria-label="EngiFarロケット"><defs><linearGradient id="homeBodyGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="oklch(0.97 0.005 260)"/><stop offset="1" stop-color="oklch(0.82 0.015 260)"/></linearGradient><radialGradient id="homeWindowGrad" cx="0.35" cy="0.3" r="0.8"><stop offset="0" stop-color="oklch(0.9 0.08 202)"/><stop offset="1" stop-color="oklch(0.55 0.14 205)"/></radialGradient><linearGradient id="homeFlameGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="oklch(0.93 0.14 95)"/><stop offset="0.5" stop-color="oklch(0.78 0.18 55)"/><stop offset="1" stop-color="oklch(0.66 0.19 35)"/></linearGradient></defs><ellipse cx="110" cy="360" rx="70" ry="42" fill="oklch(0.7 0.19 45 / 0.32)"/><path class="home-rocket-flame-svg" d="M92 296 Q84 340 110 398 Q136 340 128 296 Q120 328 110 328 Q100 328 92 296 Z" fill="url(#homeFlameGrad)"/><path d="M78 278 L96 278 L90 308 L74 308 Z" fill="oklch(0.32 0.02 260)"/><path d="M124 278 L142 278 L146 308 L130 308 Z" fill="oklch(0.32 0.02 260)"/><rect x="66" y="238" width="88" height="60" rx="14" fill="oklch(0.38 0.03 262)"/><path d="M66 248 L18 294 L50 298 L66 268 Z" fill="oklch(0.7 0.12 202)"/><path d="M154 248 L202 294 L170 298 L154 268 Z" fill="oklch(0.7 0.12 202)"/><rect x="58" y="68" width="104" height="190" rx="42" fill="url(#homeBodyGrad)"/><rect x="58" y="148" width="104" height="10" fill="oklch(0.72 0.19 42)"/><rect x="58" y="166" width="104" height="6" fill="oklch(0.76 0.12 202)"/><circle cx="110" cy="116" r="30" fill="oklch(0.3 0.02 262)"/><circle cx="110" cy="116" r="24" fill="url(#homeWindowGrad)"/><ellipse cx="101" cy="106" rx="8" ry="5" fill="oklch(0.98 0.01 200 / 0.6)"/><path d="M58 68 Q58 4 110 2 Q162 4 162 68 Z" fill="url(#homeBodyGrad)"/></svg>
        <span class="crew-avatar scene-bot scene-bot--three" style="--crew-color:#f5cf4b" aria-label="黄のクルー"><i></i></span>
        <span class="crew-avatar scene-bot scene-bot--four" style="--crew-color:#ff665f" aria-label="赤のクルー"><i></i></span>
      </section>
      <section class="home-control" aria-labelledby="setup-title">
        <div class="home-profile-row">
          <span class="crew-avatar crew-avatar--medium" id="player-preview" style="--crew-color:#54d37c" aria-hidden="true"><i></i></span>
          <label class="compact-name" for="player-name"><span id="setup-title">プレイヤー名</span><input id="player-name" type="text" maxlength="18" value="CREW MEMBER" autocomplete="name"></label>
          <div class="compact-color" aria-label="選択中のクルーカラー"><span>カラー</span><i class="selected-color-swatch" id="selected-color-swatch" style="--swatch-color:#54d37c" aria-hidden="true"></i><output id="color-code" for="player-color">#54D37C</output><input id="player-color" type="color" value="#54d37c" hidden></div>
        </div>
        <div class="color-quick-actions"><button class="color-options-toggle" id="color-options-toggle" type="button" aria-expanded="false" aria-controls="color-options-panel">色を変更</button><button class="random-color-button" id="random-color-button" type="button">ランダムカラー</button></div>
        <div class="compact-palette" id="color-options-panel" hidden><label class="hue-control" for="hue-slider"><span class="sr-only">色相を選ぶ</span><input id="hue-slider" type="range" min="0" max="359" value="145" aria-label="色相パレット"></label><div class="tone-palette" id="tone-palette" aria-label="明るさを選ぶ"></div></div>
        <div class="home-actions">
          <button class="primary-button" id="start-button" type="button"><span>ルームを作る</span><b aria-hidden="true">🚀</b></button>
          <button class="secondary-button" id="join-room-button" type="button" aria-expanded="false" aria-controls="join-room-panel"><span>ルームに入る</span><b aria-hidden="true">→</b></button>
        </div>
        <div class="room-entry-panel" id="join-room-panel" hidden><label for="room-code">招待コード</label><div><input id="room-code" type="text" maxlength="8" pattern="[A-Za-z0-9]{6,8}" placeholder="例：STAR24" autocomplete="off"><button id="enter-room-button" type="button">参加</button></div></div>
        <p class="home-room-status" id="home-room-status" aria-live="polite"></p>
        <p class="home-room-note">名前と自由なカラーを決めて、仲間が集まるルームへ。</p>
      </section>
    </main>
  </div>
</body>
</html>
