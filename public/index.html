<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ENGIFAR - 遠距離を目指せ!!</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="page">

  <!-- 背景の星空・グロー -->
  <svg class="bg-scene" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs>
      <radialGradient id="padGlow" cx="0.5" cy="0.5" r="0.5">
        <stop offset="0" stop-color="oklch(0.7 0.12 202 / 0.30)"/>
        <stop offset="1" stop-color="oklch(0.7 0.12 202 / 0)"/>
      </radialGradient>
    </defs>
    <ellipse cx="720" cy="600" rx="420" ry="140" fill="url(#padGlow)"/>
    <circle class="star" cx="120" cy="90" r="2" fill="oklch(0.9 0.01 260)" style="animation-delay:0s"/>
    <circle class="star" cx="260" cy="180" r="1.6" fill="oklch(0.9 0.01 260)" style="animation-delay:0.4s"/>
    <circle class="star" cx="1180" cy="120" r="2.2" fill="oklch(0.9 0.01 260)" style="animation-delay:0.8s"/>
    <circle class="star" cx="1320" cy="240" r="1.6" fill="oklch(0.9 0.01 260)" style="animation-delay:1.2s"/>
    <circle class="star" cx="90" cy="340" r="2" fill="oklch(0.78 0.12 202)" style="animation-delay:0.6s"/>
    <circle class="star" cx="1360" cy="420" r="2" fill="oklch(0.78 0.12 202)" style="animation-delay:1.6s"/>
    <circle class="star" cx="200" cy="500" r="1.8" fill="oklch(0.9 0.01 260)" style="animation-delay:0.2s"/>
    <circle class="star" cx="1250" cy="560" r="1.8" fill="oklch(0.9 0.01 260)" style="animation-delay:1.0s"/>
    <circle class="star" cx="60" cy="620" r="1.6" fill="oklch(0.9 0.01 260)" style="animation-delay:1.4s"/>
    <circle class="star" cx="1390" cy="150" r="1.4" fill="oklch(0.9 0.01 260)" style="animation-delay:1.8s"/>
    <circle class="star" cx="420" cy="60" r="1.4" fill="oklch(0.9 0.01 260)" style="animation-delay:2.0s"/>
    <circle class="star" cx="980" cy="70" r="1.8" fill="oklch(0.9 0.01 260)" style="animation-delay:0.9s"/>
    <g opacity="0.16" stroke="oklch(0.76 0.12 202)" fill="none" stroke-width="2">
      <circle cx="720" cy="560" r="260"/>
      <circle cx="720" cy="560" r="330"/>
    </g>
  </svg>

  <main class="content">

    <header class="hero-header">
      <h1 class="logo">ENGIFAR</h1>
      <div class="tagline">遠距離を目指せ!!</div>
    </header>

    <!-- ロボットとロケットのイラスト -->
    <svg class="scene" viewBox="0 0 1440 388" role="img" aria-label="仲間のロボットとロケット">
      <g transform="translate(354,294) scale(0.72)">
        <ellipse cx="50" cy="118" rx="24" ry="7" fill="oklch(0.68 0.16 148)" opacity="0.3"/>
        <line x1="50" y1="10" x2="50" y2="24" stroke="oklch(0.68 0.16 148)" stroke-width="4" stroke-linecap="round"/>
        <circle cx="50" cy="8" r="6" fill="oklch(0.85 0.1 202)"/>
        <rect x="20" y="22" width="60" height="76" rx="30" fill="oklch(0.68 0.16 148)" stroke="oklch(0.2 0.02 260 / 0.25)" stroke-width="2"/>
        <rect x="32" y="42" width="36" height="26" rx="12" fill="oklch(0.97 0.006 260)"/>
        <circle cx="43" cy="55" r="4" fill="oklch(0.22 0.03 262)"/>
        <circle cx="57" cy="55" r="4" fill="oklch(0.22 0.03 262)"/>
      </g>
      <g class="bot-idle" style="animation-delay:0.9s" transform="translate(494,284) scale(0.8)">
        <ellipse cx="50" cy="118" rx="24" ry="7" fill="oklch(0.66 0.15 253)" opacity="0.3"/>
        <line x1="50" y1="10" x2="50" y2="24" stroke="oklch(0.66 0.15 253)" stroke-width="4" stroke-linecap="round"/>
        <circle cx="50" cy="8" r="6" fill="oklch(0.85 0.1 202)"/>
        <rect x="20" y="22" width="60" height="76" rx="30" fill="oklch(0.66 0.15 253)" stroke="oklch(0.2 0.02 260 / 0.25)" stroke-width="2"/>
        <rect x="32" y="42" width="36" height="26" rx="12" fill="oklch(0.97 0.006 260)"/>
        <circle cx="43" cy="55" r="4" fill="oklch(0.22 0.03 262)"/>
        <circle cx="57" cy="55" r="4" fill="oklch(0.22 0.03 262)"/>
      </g>

      <g transform="translate(600,0) scale(1.0909,0.97)">
        <defs>
          <linearGradient id="bodyGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="oklch(0.97 0.005 260)"/>
            <stop offset="1" stop-color="oklch(0.82 0.015 260)"/>
          </linearGradient>
          <radialGradient id="windowGrad" cx="0.35" cy="0.3" r="0.8">
            <stop offset="0" stop-color="oklch(0.9 0.08 202)"/>
            <stop offset="1" stop-color="oklch(0.55 0.14 205)"/>
          </radialGradient>
          <linearGradient id="flameGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="oklch(0.93 0.14 95)"/>
            <stop offset="0.5" stop-color="oklch(0.78 0.18 55)"/>
            <stop offset="1" stop-color="oklch(0.66 0.19 35)"/>
          </linearGradient>
        </defs>
        <ellipse cx="110" cy="360" rx="70" ry="42" fill="oklch(0.7 0.19 45 / 0.35)"/>
        <path class="flame" d="M92 296 Q84 340 110 398 Q136 340 128 296 Q120 328 110 328 Q100 328 92 296 Z" fill="url(#flameGrad)"/>
        <path d="M78 278 L96 278 L90 308 L74 308 Z" fill="oklch(0.32 0.02 260)"/>
        <path d="M124 278 L142 278 L146 308 L130 308 Z" fill="oklch(0.32 0.02 260)"/>
        <rect x="66" y="238" width="88" height="60" rx="14" fill="oklch(0.38 0.03 262)"/>
        <path d="M66 248 L18 294 L50 298 L66 268 Z" fill="oklch(0.7 0.12 202)"/>
        <path d="M154 248 L202 294 L170 298 L154 268 Z" fill="oklch(0.7 0.12 202)"/>
        <rect x="58" y="68" width="104" height="190" rx="42" fill="url(#bodyGrad)"/>
        <rect x="58" y="148" width="104" height="10" fill="oklch(0.72 0.19 42)"/>
        <rect x="58" y="166" width="104" height="6" fill="oklch(0.76 0.12 202)"/>
        <circle cx="110" cy="116" r="30" fill="oklch(0.3 0.02 262)"/>
        <circle cx="110" cy="116" r="24" fill="url(#windowGrad)"/>
        <ellipse cx="101" cy="106" rx="8" ry="5" fill="oklch(0.98 0.01 200 / 0.6)"/>
        <path d="M58 68 Q58 4 110 2 Q162 4 162 68 Z" fill="url(#bodyGrad)"/>
        <circle class="star" cx="110" cy="12" r="7" fill="oklch(0.72 0.19 42)" style="animation-delay:0.3s"/>
      </g>

      <g class="bot-idle" style="animation-delay:0.5s" transform="translate(866,284) scale(0.8)">
        <ellipse cx="50" cy="118" rx="24" ry="7" fill="oklch(0.82 0.15 93)" opacity="0.3"/>
        <line x1="50" y1="10" x2="50" y2="24" stroke="oklch(0.82 0.15 93)" stroke-width="4" stroke-linecap="round"/>
        <circle cx="50" cy="8" r="6" fill="oklch(0.85 0.1 202)"/>
        <rect x="20" y="22" width="60" height="76" rx="30" fill="oklch(0.82 0.15 93)" stroke="oklch(0.2 0.02 260 / 0.25)" stroke-width="2"/>
        <rect x="32" y="42" width="36" height="26" rx="12" fill="oklch(0.97 0.006 260)"/>
        <circle cx="43" cy="55" r="4" fill="oklch(0.22 0.03 262)"/>
        <circle cx="57" cy="55" r="4" fill="oklch(0.22 0.03 262)"/>
      </g>
      <g class="bot-idle" style="animation-delay:1.1s" transform="translate(1014,294) scale(0.72)">
        <ellipse cx="50" cy="118" rx="24" ry="7" fill="oklch(0.72 0.17 52)" opacity="0.3"/>
        <line x1="50" y1="10" x2="50" y2="24" stroke="oklch(0.72 0.17 52)" stroke-width="4" stroke-linecap="round"/>
        <circle cx="50" cy="8" r="6" fill="oklch(0.85 0.1 202)"/>
        <rect x="20" y="22" width="60" height="76" rx="30" fill="oklch(0.72 0.17 52)" stroke="oklch(0.2 0.02 260 / 0.25)" stroke-width="2"/>
        <rect x="32" y="42" width="36" height="26" rx="12" fill="oklch(0.97 0.006 260)"/>
        <circle cx="43" cy="55" r="4" fill="oklch(0.22 0.03 262)"/>
        <circle cx="57" cy="55" r="4" fill="oklch(0.22 0.03 262)"/>
      </g>
    </svg>

    <div class="players">
      <div class="avatars">
        <span class="avatar" style="background:oklch(0.64 0.19 24)"></span>
        <span class="avatar" style="background:oklch(0.66 0.15 253)"></span>
        <span class="avatar" style="background:oklch(0.64 0.18 312)"></span>
        <span class="avatar avatar-more">+5</span>
      </div>
      <span class="players-text">現在 8人が集合中!</span>
    </div>

    <div class="actions">
      <button type="button" class="btn btn-primary" id="startBtn" aria-expanded="false" aria-controls="createPanel">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2c3 2 5 6 5 10 0 3-2 6-5 8-3-2-5-5-5-8 0-4 2-8 5-10Z"/><circle cx="12" cy="10" r="1.6"/><path d="M8 16l-3 5M16 16l3 5"/></svg>
        <span>ゲームを始める</span>
      </button>
      <button type="button" class="btn btn-secondary" id="joinBtn" aria-expanded="false" aria-controls="joinPanel">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="18" cy="8" r="2.5"/><path d="M15 14.2c2.3.4 4 2.4 4 4.8"/></svg>
        <span>チームに参加する</span>
      </button>
    </div>

    <section id="createPanel" class="panel" hidden>
      <div class="panel-title">新しいチームを作成</div>
      <div class="panel-row">
        <input class="field" type="text" placeholder="チーム名を入力（例: ロケット部）">
        <button type="button" class="field-btn create-btn">作成する</button>
      </div>
      <div class="panel-note">作成すると、メンバーを招待するQRコードとURLが発行されます。</div>
    </section>

    <section id="joinPanel" class="panel" hidden>
      <div class="panel-title">チームに参加する</div>
      <div class="panel-row">
        <button type="button" class="scan-btn" aria-label="QRコードをスキャン">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="oklch(0.76 0.12 202)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7V4h3M20 7V4h-3M4 17v3h3M20 17v3h-3"/><rect x="9" y="9" width="6" height="6"/></svg>
        </button>
        <input class="field" type="text" placeholder="招待コードまたはURLを入力">
        <button type="button" class="field-btn join-btn">参加する</button>
      </div>
      <div class="panel-note">QRコードから読み取った場合は自動的に入力されます。</div>
    </section>

  </main>
</div>

<script src="main.js"></script>
</body>
</html>
