<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <title>EngiFar | 自己紹介カード</title>
  <link rel="stylesheet" href="./styles.css?v=20260825-quiz-layout">
  <script src="./index.js?v=20260825-quiz-layout" defer></script>
</head>
<body>
  <div class="app-shell" id="app" data-page="card">
    <div class="space-background" aria-hidden="true"></div>

    <header class="topbar">
      <a class="brand" id="result-back-top" href="./result.html" aria-label="リザルトへ戻る">
        <span class="brand-mark" aria-hidden="true">E</span>
        <span><strong>EngiFar</strong><small>CREW PROFILE</small></span>
      </a>
      <div class="route-chip route-chip--complete"><span>05</span> CARD READY</div>
    </header>

    <main class="card-layout">
      <section class="card-preview-wrap" aria-labelledby="card-title">
        <div class="card-preview-head">
          <div><p class="eyebrow">YOUR MISSION MEMORY</p><h1 id="card-title">自己紹介カード完成！</h1></div>
          <span class="crew-avatar crew-avatar--medium" id="card-player-avatar" style="--crew-color:#54d37c" aria-hidden="true"><i></i></span>
        </div>
        <div class="canvas-frame"><canvas id="profile-card" width="1200" height="760">EngiFar自己紹介カード</canvas></div>
      </section>

      <aside class="card-controls">
        <div class="card-player-summary">
          <small>CREW MEMBER</small>
          <strong id="card-player-name">CREW MEMBER</strong>
          <div class="card-role-summary"><span>適正役割</span><b id="card-role">INTERFACE CREATOR</b></div>
          <p id="card-comment">画面の構造・見た目・動きを心地よく組み立てるクルー</p>
        </div>

        <dl class="card-mini-metrics">
          <div class="card-rank-metric"><dt>RANK</dt><dd id="card-rank">大空飛行級</dd></div>
          <div><dt>OUTPUT</dt><dd><b id="card-power">0</b>%</dd></div>
          <div><dt>SAFETY</dt><dd><b id="card-safety">0</b>%</dd></div>
          <div class="card-distance-metric"><dt>DISTANCE</dt><dd><b id="card-altitude">0</b> km</dd></div>
        </dl>

        <p class="save-note"><span aria-hidden="true">↓</span> PNG画像として端末に保存できます。</p>
        <button class="primary-button" id="save-card-button" type="button"><span id="save-card-label">PNGで保存</span><b aria-hidden="true">↓</b></button>
        <a class="secondary-button" id="result-back-link" href="./result.html">← リザルトへ戻る</a>
      </aside>
    </main>
  </div>
</body>
</html>
