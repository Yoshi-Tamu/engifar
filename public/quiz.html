<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <title>EngiFar | Web基礎クイズ</title>
  <link rel="stylesheet" href="./style.css?v=20260824-rank">
  <script src="./script.js?v=20260824-rank" defer></script>
</head>
<body>
  <div class="app-shell" id="app" data-page="quiz">
    <div class="space-background" aria-hidden="true"></div>

    <header class="topbar">
      <div class="brand" aria-label="EngiFar">
        <span class="brand-mark" aria-hidden="true">E</span>
        <span><strong>EngiFar</strong><small>WEB QUIZ FLIGHT</small></span>
      </div>
      <div class="player-chip">
        <span class="crew-avatar crew-avatar--tiny" id="quiz-player-avatar" style="--crew-color:#54d37c" aria-hidden="true"><svg class="crew-avatar-svg" viewBox="0 0 100 130" role="img" aria-hidden="true" focusable="false"><ellipse cx="50" cy="118" rx="24" ry="7" fill="var(--crew-color, #54d37c)" opacity="0.3"></ellipse><line x1="50" y1="10" x2="50" y2="24" stroke="var(--crew-color, #54d37c)" stroke-width="4" stroke-linecap="round"></line><circle cx="50" cy="8" r="6" fill="#62e4ec"></circle><rect x="20" y="22" width="60" height="76" rx="30" fill="var(--crew-color, #54d37c)" stroke="rgba(255,255,255,.18)" stroke-width="2"></rect><rect x="32" y="42" width="36" height="26" rx="12" fill="#f0f7f5"></rect><circle cx="43" cy="55" r="4" fill="#122232"></circle><circle cx="57" cy="55" r="4" fill="#122232"></circle></svg></span>
        <strong id="quiz-player-name">CREW MEMBER</strong>
      </div>
    </header>

    <main class="quiz-layout">
      <section class="quiz-card" id="quiz-card" data-mode="answer" aria-live="polite">
        <header class="quiz-head">
          <div>
            <p class="eyebrow">KNOWLEDGE CHARGE</p>
            <div class="question-count"><strong id="question-current">01</strong><span>/ 24</span></div>
          </div>
          <div class="quiz-head-side">
            <span class="category-chip" id="question-category">フロントエンド</span>
            <span class="difficulty-chip" id="question-difficulty">BASIC</span>
          </div>
        </header>

        <div class="progress-track" aria-label="クイズ進捗"><i id="quiz-progress"></i></div>

        <div class="question-zone">
          <div class="timer-dial" id="timer-dial" style="--timer-progress:1">
            <span id="timer-label">回答</span>
            <strong id="timer-value">10</strong>
            <small>秒</small>
          </div>
          <div class="question-copy">
            <p class="question-instruction" id="question-instruction">説明を読み、空欄に入る答えを選んでください。</p>
            <pre id="question-text">問題を準備しています...</pre>
          </div>
        </div>

        <div class="answer-grid" id="answer-grid" aria-label="回答の選択肢"></div>

        <footer class="feedback-bar" id="feedback-bar">
          <span class="feedback-icon" id="feedback-icon" aria-hidden="true">✦</span>
          <div>
            <strong id="feedback-title">10秒間は何度でも回答を変更できます</strong>
            <p id="feedback-text">選んだ答えはオレンジ色で表示されます。</p>
          </div>
          <span class="review-count" id="review-count" hidden>5</span>
        </footer>
      </section>
    </main>
  </div>
</body>
</html>
