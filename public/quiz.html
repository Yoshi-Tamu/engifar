<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <title>EngiFar | Web基礎クイズ</title>
  <link rel="stylesheet" href="./styles.css?v=20260825-quiz-layout">
  <script src="./index.js?v=20260825-quiz-layout" defer></script>
</head>
<body>
  <div class="app-shell" id="app" data-page="quiz">
    <div class="space-background" aria-hidden="true"></div>

    <header class="topbar">
      <div class="brand" aria-label="EngiFar">
        <span class="brand-mark" aria-hidden="true">E</span>
        <span><strong>EngiFar</strong><small>WEB QUIZ FLIGHT</small></span>
      </div>
      <div class="player-chip">
        <span class="crew-avatar crew-avatar--tiny" id="quiz-player-avatar" style="--crew-color:#54d37c" aria-hidden="true"><i></i></span>
        <strong id="quiz-player-name">CREW MEMBER</strong>
      </div>
    </header>

    <main class="quiz-layout">
      <section class="quiz-card" id="quiz-card" data-mode="answer" aria-live="polite">
        <header class="quiz-head">
          <div>
            <p class="eyebrow">KNOWLEDGE CHARGE</p>
            <div class="question-count"><strong id="question-current">01</strong><span>/ 24</span></div>
          </div>
          <div class="quiz-head-side">
            <span class="category-chip" id="question-category">フロントエンド</span>
            <span class="difficulty-chip" id="question-difficulty">BASIC</span>
          </div>
        </header>

        <div class="progress-track" aria-label="クイズ進捗"><i id="quiz-progress"></i></div>

        <div class="question-zone">
          <div class="timer-dial" id="timer-dial" style="--timer-progress:1">
            <span id="timer-label">回答時間</span>
            <div><strong id="timer-value">10</strong><small>秒</small></div>
          </div>
          <div class="question-copy">
            <div class="question-prompt"><span class="question-row-label">問題文</span><p class="question-instruction" id="question-instruction">説明を読み、空欄に入る答えを選んでください。</p></div>
            <div class="question-fill"><span class="question-row-label">穴埋め部分</span><pre id="question-text">問題を準備しています...</pre></div>
          </div>
        </div>

        <div class="answer-grid" id="answer-grid" aria-label="回答の選択肢"></div>

        <footer class="feedback-bar" id="feedback-bar">
          <span class="feedback-icon" id="feedback-icon" aria-hidden="true">✦</span>
          <div>
            <strong id="feedback-title">10秒間は何度でも回答を変更できます</strong>
            <p id="feedback-text">選んだ答えはオレンジ色で表示されます。</p>
          </div>
          <span class="review-count" id="review-count" hidden>5</span>
        </footer>
      </section>
    </main>
  </div>
</body>
</html>
