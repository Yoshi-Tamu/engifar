<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <title>EngiFar | ルーム</title>
  <link rel="stylesheet" href="./styles.css?v=20260825-quiz-layout">
  <script src="./index.js?v=20260825-quiz-layout" defer></script>
</head>
<body>
  <div class="app-shell room-shell" id="app" data-page="room">
    <div class="space-background" aria-hidden="true"></div>
    <header class="room-header"><a class="room-brand" id="room-home-link" href="./index.html"><strong>ENGIFAR</strong></a><div class="room-header-actions"><button class="guide-open-button" type="button" aria-haspopup="dialog"><span>?</span> 遊び方</button><div class="room-code-badge"><small>ROOM CODE</small><strong id="room-code-value">------</strong></div></div></header>
    <main class="room-main-simple">
      <section class="room-stage" aria-label="ロケットのまわりに集まったメンバー">
        <span class="room-ring room-ring--outer" aria-hidden="true"></span><span class="room-ring room-ring--inner" aria-hidden="true"></span>
        <div class="home-rocket room-rocket" aria-hidden="true"><span class="home-rocket-tip"></span><span class="home-rocket-window"></span><span class="home-rocket-band home-rocket-band--orange"></span><span class="home-rocket-band home-rocket-band--cyan"></span><span class="home-rocket-fin home-rocket-fin--left"></span><span class="home-rocket-fin home-rocket-fin--right"></span><span class="home-rocket-engine"></span><span class="home-rocket-flame"></span></div>
        <span class="crew-avatar room-bot room-bot--one" style="--crew-color:#ff665f"><i></i></span><span class="crew-avatar room-bot room-bot--two" style="--crew-color:#5ca9ff"><i></i></span><span class="crew-avatar room-bot room-bot--three" style="--crew-color:#f5cf4b"><i></i></span><span class="crew-avatar room-bot room-bot--four" style="--crew-color:#54d37c"><i></i></span><span class="crew-avatar room-bot room-bot--player" id="room-player-avatar" style="--crew-color:#b889ff"><i></i><b>YOU</b></span>
      </section>
      <section class="room-lobby-panel"><p class="eyebrow">CREW LOBBY</p><h1>出発する仲間が集合中！</h1><div class="room-player-card"><span class="crew-avatar crew-avatar--small" id="room-list-avatar" style="--crew-color:#54d37c"><i></i></span><div><small>READY CREW</small><strong id="room-player-name">CREW MEMBER</strong></div><span class="ready-badge">準備OK</span></div><p class="room-future-note">招待コードで仲間が参加できるマルチプレイへ拡張できるルーム構成です。</p><button class="primary-button" id="room-start-button" type="button"><span>クイズを始める</span><b aria-hidden="true">→</b></button></section>
    </main>
  </div>
</body>
</html>
