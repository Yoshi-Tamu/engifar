<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>EngiFar - ロケット発射</title>
<link rel="stylesheet" href="./rocket-launch.css">
<link rel="stylesheet" href="./rocket-result.css?v=20260824-altitude-impact">
<script src="./rocket-launch-results.js" defer></script>
<script src="./index.js?v=20260825-quiz-layout" defer></script>
</head>
<body>
<div class="rl-app" id="app" data-page="rocket">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="rlBodyGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="oklch(0.97 0.005 260)"/><stop offset="1" stop-color="oklch(0.82 0.015 260)"/></linearGradient>
      <radialGradient id="rlWindowGrad" cx="0.35" cy="0.3" r="0.8"><stop offset="0" stop-color="oklch(0.9 0.08 202)"/><stop offset="1" stop-color="oklch(0.55 0.14 205)"/></radialGradient>
      <linearGradient id="rlFlameGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="oklch(0.93 0.14 95)"/><stop offset="0.5" stop-color="oklch(0.78 0.18 55)"/><stop offset="1" stop-color="oklch(0.66 0.19 35)"/></linearGradient>
    </defs>
  </svg>

  <section class="rl-screen rl-screen-setup is-active" id="screenSetup">
    <div class="rl-setup-card">
      <div class="rl-brand">ENGIFAR</div>
      <h1 class="rl-setup-title">ロケット発射準備</h1>
      <p class="rl-setup-hint">クルーと一緒に、到達ランクを目指して出発します。</p>
      <button type="button" class="rl-launch-btn" id="launchBtn"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2c3 2 5 6 5 10 0 3-2 6-5 8-3-2-5-5-5-8 0-4 2-8 5-10Z"/><circle cx="12" cy="10" r="1.6"/><path d="M8 16l-3 5M16 16l3 5"/></svg><span>ロケットを飛ばす</span></button>
    </div>
  </section>

  <section class="rl-screen rl-screen-launch" id="screenLaunch" aria-hidden="true">
    <div class="rl-sky" id="rlSky">
      <div class="rl-sky-layer rl-sky-ground" data-leg="ground"></div><div class="rl-sky-layer rl-sky-upper" data-leg="sky"></div><div class="rl-sky-layer rl-sky-edge" data-leg="atmosphere-edge"></div>
      <div class="rl-sky-layer rl-sky-space" data-leg="space"><div class="rl-stars"></div><div class="rl-approach-body" id="approachBody"></div></div><div class="rl-sky-layer rl-sky-sea" data-leg="sea"></div>
    </div>
    <div class="rl-ground-line" id="rlGroundLine"></div>
    <div class="rl-launch-stage">
      <div class="rl-bots-runway" id="botsRunway"></div>
      <div class="rl-rocket-wrap" id="rocketWrap">
        <div class="rl-rocket-smoke" id="rocketSmoke"></div>
        <svg class="rl-rocket-svg" id="rocketSvg" viewBox="0 0 220 400" role="img" aria-label="ロケット">
          <ellipse class="rl-rocket-glow" cx="110" cy="360" rx="70" ry="42" fill="oklch(0.7 0.19 45 / 0.35)"/><path class="rl-flame" id="rlFlame" d="M92 296 Q84 340 110 398 Q136 340 128 296 Q120 328 110 328 Q100 328 92 296 Z" fill="url(#rlFlameGrad)"/>
          <path d="M78 278 L96 278 L90 308 L74 308 Z" fill="oklch(0.32 0.02 260)"/><path d="M124 278 L142 278 L146 308 L130 308 Z" fill="oklch(0.32 0.02 260)"/><rect x="66" y="238" width="88" height="60" rx="14" fill="oklch(0.38 0.03 262)"/><path d="M66 248 L18 294 L50 298 L66 268 Z" fill="oklch(0.7 0.12 202)"/><path d="M154 248 L202 294 L170 298 L154 268 Z" fill="oklch(0.7 0.12 202)"/><rect x="58" y="68" width="104" height="190" rx="42" fill="url(#rlBodyGrad)"/><rect x="58" y="148" width="104" height="10" fill="oklch(0.72 0.19 42)"/><rect x="58" y="166" width="104" height="6" fill="oklch(0.76 0.12 202)"/><rect class="rl-rocket-hatch" id="rlHatch" x="90" y="210" width="40" height="34" rx="8" fill="oklch(0.24 0.03 262)"/><circle cx="110" cy="116" r="30" fill="oklch(0.3 0.02 262)"/><circle cx="110" cy="116" r="24" fill="url(#rlWindowGrad)"/><ellipse cx="101" cy="106" rx="8" ry="5" fill="oklch(0.98 0.01 200 / 0.6)"/><path d="M58 68 Q58 4 110 2 Q162 4 162 68 Z" fill="url(#rlBodyGrad)"/>
        </svg>
      </div>
    </div>
    <div class="rl-countdown" id="rlCountdown" aria-hidden="true"></div><p class="rl-flight-caption" id="flightCaption"></p>
  </section>

  <section class="rl-screen rl-screen-result" id="screenResult" aria-hidden="true">
    <div class="rl-result-bg" id="resultBg"></div>
    <div class="rl-result-content"><div class="rl-result-title-wrap" id="resultTitleWrap"><span class="rl-result-title" id="resultTitle">不時着級</span></div><div class="rl-altitude-impact" aria-label="到達距離"><span>到達距離</span><strong id="impactAltitude">0</strong><b>km</b></div><svg class="rl-result-illustration" id="resultIllustration" viewBox="0 0 640 480" role="img" aria-label="到達結果イラスト"></svg><p class="rl-result-dest" id="resultDest"></p><button type="button" class="rl-again-btn" id="againBtn">リザルトを見る</button></div>
  </section>
</div>
</body>
</html>
